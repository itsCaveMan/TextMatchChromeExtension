<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proof Read Sentiment App - TextMatch</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            padding: 3rem;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 600px;
            width: 90%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 2rem;
            font-size: 2.5rem;
            font-weight: 300;
        }
        
        .input-group {
            margin-bottom: 2rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
            font-weight: 500;
            text-align: left;
        }
        
        textarea {
            width: 100%;
            min-height: 200px;
            padding: 1rem;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
            box-sizing: border-box;
            resize: vertical;
            font-family: inherit;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s ease;
            margin: 0.5rem;
        }
        
        .button:hover {
            transform: translateY(-2px);
        }
        
        .description {
            color: #666;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        
        .navigation {
            margin-bottom: 2rem;
        }
        
        .nav-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        
        .nav-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="navigation">
            <a href="index.html" class="nav-link">← Back to Main</a>
        </div>
        
        <h1>Proof Read Sentiment App</h1>
        <p class="description">
            Enter your text below for proofreading and sentiment analysis.
        </p>
        
        <form id="textForm">
            <div class="input-group">
                <label for="textInput">Text to Analyze</label>
                <textarea 
                    id="textInput" 
                    name="textInput" 
                    placeholder="Enter your text here for proofreading and sentiment analysis..." 
                    required>
                </textarea>
            </div>
            <button type="submit" class="button">Analyze Text</button>
            <button type="button" class="button" onclick="clearText()">Clear</button>
        </form>
        
        <div id="result" style="margin-top: 2rem; color: #667eea; font-weight: 500;"></div>
    </div>

    <script>
        document.getElementById('textForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const text = document.getElementById('textInput').value;
            const result = document.getElementById('result');
            
            if (text.trim()) {
                result.textContent = `Text received! Analysis features coming soon...`;
            }
        });
        
        function clearText() {
            document.getElementById('textInput').value = '';
            document.getElementById('result').textContent = '';
        }
    </script>
</body>
</html>
