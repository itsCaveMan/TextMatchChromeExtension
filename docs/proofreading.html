<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proof Read Sentiment App - TextMatch</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            padding: 3rem;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 80%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 2rem;
            font-size: 2.5rem;
            font-weight: 300;
        }
        
        .input-group {
            margin-bottom: 2rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
            font-weight: 500;
            text-align: left;
        }
        
        input[type="password"], input[type="text"] {
            width: 100%;
            padding: 1rem;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
            box-sizing: border-box;
            font-family: inherit;
        }
        
        textarea {
            width: 100%;
            min-height: 100px;
            padding: 1rem;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
            box-sizing: border-box;
            resize: vertical;
            font-family: inherit;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s ease;
            margin: 0.5rem;
        }
        
        .button:hover {
            transform: translateY(-2px);
        }
        
        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .description {
            color: #666;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        
        .navigation {
            margin-bottom: 2rem;
        }
        
        .nav-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        
        .nav-link:hover {
            text-decoration: underline;
        }
        
        .result-container {
            margin-top: 2rem;
            padding: 1.5rem;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            text-align: left;
            display: none;
        }
        
        .result-container h3 {
            margin-top: 0;
            color: #333;
        }
        
        .result-text {
            color: #555;
            line-height: 1.6;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #e1e5e9;
            padding: 1rem;
            border-radius: 5px;
            background-color: #ffffff;
        }
        
        .loading {
            color: #667eea;
            font-weight: 500;
            font-style: italic;
        }
        
        .error {
            color: #dc3545;
            font-weight: 500;
        }
        
        .api-key-note {
            font-size: 0.9rem;
            color: #666;
            font-style: italic;
            text-align: left;
        }

        .table-container {
            margin-top: 1rem;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            overflow: auto;
            display: none;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .data-table th,
        .data-table td {
            border: 1px solid #e1e5e9;
            padding: 0.5rem;
            text-align: left;
            white-space: nowrap;
            max-width: 40rem;
            overflow: scroll;
            text-overflow: ellipsis;
            height: 1rem;
            scrollbar-width: none;
            -ms-overflow-style: none;
            &::-webkit-scrollbar {
                display: none;
            }
        }

        .data-table th {
            background-color: #f8f9fa;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .data-table tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        .data-table tr:hover {
            background-color: #e9ecef;
        }

        .table-info {
            padding: 0.5rem;
            background-color: #e7f3ff;
            border-bottom: 1px solid #e1e5e9;
            font-size: 0.85rem;
            color: #666;
        }

        .results-table-container {
            margin-top: 1.5rem;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            overflow: auto;
            display: none;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .results-table th,
        .results-table td {
            border: 1px solid #e1e5e9;
            padding: 0.75rem;
            text-align: left;
            vertical-align: top;
        }

        .results-table th {
            background-color: #f8f9fa;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .results-table .original-row {
            background-color: #f8f9fa;
        }

        .results-table .corrected-row {
            background-color: #ffffff;
        }

        .results-table .accurate-true {
            color: #28a745;
            font-weight: 600;
        }

        .results-table .accurate-false {
            color: #dc3545;
            font-weight: 600;
        }

        .diff-highlight {
            background-color: #fff3cd;
            color: #856404;
            padding: 2px 4px;
            border-radius: 3px;
            margin: 0 1px;
        }

        .data-table td,
        .results-table td {
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .data-table td:hover,
        .results-table td:hover {
            background-color: #e9ecef !important;
        }

        .copy-feedback {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .copy-feedback.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="navigation">
            <a href="index.html" class="nav-link">← Back to Main</a>
        </div>
        
        <h1>Proof Read Sentiment App</h1>
        <p class="description">
            Enter your OpenAI API key, customize your prompt, and get AI-powered text analysis.
        </p>
        
        <form id="textForm">
            <div class="input-group">
                <label for="apiKey">OpenAI API Key</label>
                <input 
                    type="password" 
                    id="apiKey" 
                    name="apiKey" 
                    placeholder="sk-..." 
                    required>
            </div>
            
            <div class="input-group">
                <label for="promptInput">LLM Prompt</label>
                <textarea 
                    id="promptInput" 
                    name="promptInput" 
                    rows="3"
                    placeholder="" 
                    required>
Context: you are given review data in the form of JSON. 

Follow the tasks in the JSON response format. 
Those are 3 tasks:
- correct any typos in the original review text
- translate the review to English
- was the original translation accurate

RESPONSE FORMAT:
{
    "original_review": "" // the original review
    "corrected_review": "" // the original review with any typos corrected
    "english_translation": // the original english translation
    "gpt_translation": "" // your/GPT english translation
    "review_language": "", // what language is the review written in, emoji + name
    "detected_languages": "" // Emojis of other languages detected in the original review
}
</textarea>
            </div>
            
            <div class="input-group">
                <label for="jsonPreview">JSON Preview</label>
                <textarea 
                    id="jsonPreview" 
                    name="jsonPreview" 
                    placeholder="JSON representation of your tabular data will appear here..."
                    rows="1"
                    readonly
                    style="color: #b8b8b8; min-height: 10px;"
                    >
                </textarea>
            </div>
            
            <div class="input-group">
                <h1 for="textInput">Text to Analyze</h1>
                <textarea 
                    id="textInput" 
                    name="textInput" 
                    placeholder="Enter your text here for proofreading and sentiment analysis..." 
                    rows="20"
                    required>
                </textarea>
                
                <div id="tableContainer" class="table-container">
                    <div class="table-info">
                        <strong>Table Preview:</strong> <span id="tableInfo"></span>
                    </div>
                    <table id="dataTable" class="data-table">
                    </table>
                </div>
            </div>
            
            <button type="submit" class="button" id="submitBtn">Analyze with GPT</button>
            <button type="button" class="button" onclick="clearAll()">Clear All</button>
        </form>
        
        <div id="result" class="loading" style="margin-top: 2rem; display: none;"></div>
        
        <div id="resultContainer" class="result-container">
            <h3>AI Analysis Results</h3>
            <div id="resultText" class="result-text"></div>
            
            <div id="resultsTableContainer" class="results-table-container">
                <div class="table-info">
                    <strong>Analysis Results Table:</strong> <span id="resultsTableInfo"></span>
                </div>
                <table id="resultsTable" class="results-table">
                    <thead>
                        <tr>
                            <th>Original Review</th>
                            <th>English Translation</th>
                            <th>Languages</th>
                        </tr>
                    </thead>
                    <tbody id="resultsTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="copyFeedback" class="copy-feedback">Copied to clipboard!</div>

    <script>
        // Function to copy text to clipboard and show feedback
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(function() {
                showCopyFeedback();
            }).catch(function(err) {
                console.error('Failed to copy text: ', err);
                // Fallback for older browsers
                const textArea = document.createElement('textarea');
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    showCopyFeedback();
                } catch (err) {
                    console.error('Fallback copy failed: ', err);
                }
                document.body.removeChild(textArea);
            });
        }

        // Function to show copy feedback
        function showCopyFeedback() {
            const feedback = document.getElementById('copyFeedback');
            feedback.classList.add('show');
            setTimeout(() => {
                feedback.classList.remove('show');
            }, 2000);
        }

        // Function to add click-to-copy functionality to table cells
        function addCopyFunctionality(table) {
            const cells = table.querySelectorAll('td');
            cells.forEach(cell => {
                cell.addEventListener('click', function() {
                    // Get the original text content, stripping HTML tags
                    const text = this.textContent || this.innerText;
                    copyToClipboard(text);
                });
            });
        }

        // Load saved values on page load
        window.addEventListener('load', function() {
            const savedApiKey = localStorage.getItem('openai_api_key');
            const savedPrompt = localStorage.getItem('llm_prompt');
            const savedText = localStorage.getItem('text_to_analyze');
            const savedJson = localStorage.getItem('json_preview');
            
            if (savedApiKey) {
                document.getElementById('apiKey').value = savedApiKey;
            }
            
            if (savedPrompt) {
                document.getElementById('promptInput').value = savedPrompt;
            } else {
                // If no saved prompt, ensure the default is saved to localStorage
                const defaultPrompt = document.getElementById('promptInput').value;
                if (defaultPrompt) {
                    localStorage.setItem('llm_prompt', defaultPrompt);
                }
            }
            
            if (savedText) {
                document.getElementById('textInput').value = savedText;
                handleTextChange(); // Update table with saved data
            }
            
            if (savedJson) {
                document.getElementById('jsonPreview').value = savedJson;
            }
        });

        // Save values to localStorage when they change
        document.getElementById('apiKey').addEventListener('input', function() {
            localStorage.setItem('openai_api_key', this.value);
        });

        document.getElementById('promptInput').addEventListener('input', function() {
            localStorage.setItem('llm_prompt', this.value);
        });

        document.getElementById('textInput').addEventListener('input', function() {
            localStorage.setItem('text_to_analyze', this.value);
            handleTextChange(); // Update table when text changes
        });

        // Parse text into table data
        function parseTableData(text) {
            if (!text) {
                return null;
            }
            
            // Detect separator: prefer tabs, but fall back to pipes if no tabs found
            let separator = '\t';
            if (!text.includes('\t') && text.includes('|')) {
                separator = '|';
            } else if (!text.includes('\t') && !text.includes('|')) {
                return null; // Not tabular data
            }
            
            const rows = text.split('\n').filter(row => row.trim() !== '');
            const tableData = rows.map(row => row.split(separator));
            
            // Filter out rows that don't have the separator (single column rows)
            const multiColumnRows = tableData.filter(row => row.length > 1);
            
            if (multiColumnRows.length === 0) {
                return null; // No valid tabular data
            }
            
            // Find the maximum number of columns
            const maxCols = Math.max(...multiColumnRows.map(row => row.length));
            
            // Normalize all rows to have the same number of columns
            multiColumnRows.forEach(row => {
                while (row.length < maxCols) {
                    row.push('');
                }
            });
            
            return multiColumnRows;
        }

        // Convert table data to JSON format
        function generateJsonFromTable(tableData) {
            if (!tableData || tableData.length < 1) {
                return null; // Need at least one data row
            }
            
            const jsonArray = [];
            
            // Process all rows as data (no header assumption)
            for (let i = 0; i < tableData.length; i++) {
                const row = tableData[i];
                if (row.length >= 2) {
                    const jsonObject = {
                        original_review: row[0] || '',
                        english_translation: row[1] || ''
                    };
                    jsonArray.push(jsonObject);
                }
            }
            
            return jsonArray.length > 0 ? JSON.stringify(jsonArray, null, 2) : null;
        }

        // Create and display table
        function displayTable(tableData) {
            const tableContainer = document.getElementById('tableContainer');
            const dataTable = document.getElementById('dataTable');
            const tableInfo = document.getElementById('tableInfo');
            
            if (!tableData || tableData.length === 0) {
                tableContainer.style.display = 'none';
                return;
            }
            
            // Clear existing table
            dataTable.innerHTML = '';
            
            // Create header row with generic column names
            const thead = document.createElement('thead');
            const headerRow = document.createElement('tr');
            
            const columnCount = tableData[0].length;
            for (let i = 0; i < columnCount; i++) {
                const th = document.createElement('th');
                if (i === 0) {
                    th.textContent = 'Original Review';
                } else if (i === 1) {
                    th.textContent = 'English Translation';
                } else {
                    th.textContent = `Column ${i + 1}`;
                }
                headerRow.appendChild(th);
            }
            
            thead.appendChild(headerRow);
            dataTable.appendChild(thead);
            
            // Create body rows (treat all input rows as data)
            const tbody = document.createElement('tbody');
            
            for (let i = 0; i < tableData.length; i++) {
                const row = document.createElement('tr');
                tableData[i].forEach(cellData => {
                    const td = document.createElement('td');
                    td.textContent = cellData;
                    row.appendChild(td);
                });
                tbody.appendChild(row);
            }
            
            dataTable.appendChild(tbody);
            
            // Update table info
            const rows = tableData.length;
            const cols = tableData[0].length;
            tableInfo.textContent = `${rows} rows × ${cols} columns`;
            
            // Show table
            tableContainer.style.display = 'block';
            
            // Add click-to-copy functionality
            addCopyFunctionality(dataTable);
        }

        // Handle text input changes
        function handleTextChange() {
            const text = document.getElementById('textInput').value;
            const tableData = parseTableData(text);
            const jsonPreview = document.getElementById('jsonPreview');
            
            displayTable(tableData);
            
            // Generate and display JSON
            if (tableData) {
                const jsonData = generateJsonFromTable(tableData);
                if (jsonData) {
                    jsonPreview.value = jsonData;
                    localStorage.setItem('json_preview', jsonData);
                } else {
                    jsonPreview.value = '';
                    localStorage.removeItem('json_preview');
                }
            } else {
                jsonPreview.value = '';
                localStorage.removeItem('json_preview');
            }
        }

        // Handle paste events for table data
        document.getElementById('textInput').addEventListener('paste', function(e) {
            e.preventDefault();
            
            // Get the pasted data
            const paste = (e.clipboardData || window.clipboardData).getData('text');
            
            // Insert the pasted text at cursor position (preserve tabs)
            const start = this.selectionStart;
            const end = this.selectionEnd;
            const currentValue = this.value;
            
            this.value = currentValue.substring(0, start) + paste + currentValue.substring(end);
            
            // Set cursor position after the inserted text
            const newCursorPos = start + paste.length;
            this.setSelectionRange(newCursorPos, newCursorPos);
            
            // Trigger input event to save to localStorage and update table
            this.dispatchEvent(new Event('input'));
        });

        document.getElementById('textForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const apiKey = document.getElementById('apiKey').value.trim();
            const prompt = document.getElementById('promptInput').value.trim();
            const text = document.getElementById('textInput').value.trim();
            
            const resultDiv = document.getElementById('result');
            const resultContainer = document.getElementById('resultContainer');
            const resultText = document.getElementById('resultText');
            const submitBtn = document.getElementById('submitBtn');
            
            if (!apiKey || !prompt || !text) {
                let missingFields = [];
                if (!apiKey) missingFields.push('OpenAI API Key');
                if (!prompt) missingFields.push('LLM Prompt');
                if (!text) missingFields.push('Text to Analyze');
                
                resultDiv.textContent = `Please fill in: ${missingFields.join(', ')}`;
                resultDiv.className = 'error';
                resultDiv.style.display = 'block';
                return;
            }
            
            // Save API key to localStorage
            localStorage.setItem('openai_api_key', apiKey);
            
            // Show loading state
            resultDiv.textContent = 'Analyzing with GPT... Please wait.';
            resultDiv.className = 'loading';
            resultDiv.style.display = 'block';
            resultContainer.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Analyzing...';
            
            const jsonPreviewText = document.getElementById('jsonPreview').value;
            
            const fullPrompt = `
INSTRUCTIONS:
${prompt}

JSON DATA:
${jsonPreviewText}

`

            console.log(fullPrompt);


            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-4.1',
                        messages: [
                            {
                                role: 'user',
                                content: fullPrompt
                            }
                        ],
                        // max_tokens: 1500,
                        // temperature: 0.7
                    })
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(`API Error: ${errorData.error?.message || 'Unknown error'}`);
                }
                
                const data = await response.json();
                const analysisResult = data.choices[0].message.content;
                
                // Display results
                resultDiv.style.display = 'none';
                resultText.textContent = analysisResult;
                resultContainer.style.display = 'block';
                
                // Try to display results in table format
                displayResultsTable(analysisResult);
                
            } catch (error) {
                console.error('Error:', error);
                resultDiv.textContent = `Error: ${error.message}`;
                resultDiv.className = 'error';
                resultContainer.style.display = 'none';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Analyze with GPT';
            }
        });
        
        // Function to highlight different words between two texts
        function createTextDiff(originalText, modifiedText) {
            if (!modifiedText) return '';
            
            const originalWords = (originalText || '').split(/(\s+)/);
            const modifiedWords = modifiedText.split(/(\s+)/);
            
            const originalSet = new Set(originalWords.filter(word => word.trim()));
            
            return modifiedWords.map(word => {
                if (word.trim() && !originalSet.has(word)) {
                    return `<span class="diff-highlight">${word}</span>`;
                }
                return word;
            }).join('');
        }

        // Function to parse and display GPT results in table format
        function displayResultsTable(gptResponse) {
            const resultsTableContainer = document.getElementById('resultsTableContainer');
            const resultsTableBody = document.getElementById('resultsTableBody');
            const resultsTableInfo = document.getElementById('resultsTableInfo');
            
            // Clear existing table content
            resultsTableBody.innerHTML = '';
            
            try {
                // Try to parse the response as JSON
                let jsonData;
                if (typeof gptResponse === 'string') {
                    // Look for JSON array in the response
                    const jsonMatch = gptResponse.match(/\[[\s\S]*\]/);
                    if (jsonMatch) {
                        jsonData = JSON.parse(jsonMatch[0]);
                    } else {
                        // If no JSON array found, hide the table
                        resultsTableContainer.style.display = 'none';
                        return;
                    }
                } else {
                    jsonData = gptResponse;
                }
                
                if (!Array.isArray(jsonData) || jsonData.length === 0) {
                    resultsTableContainer.style.display = 'none';
                    return;
                }
                
                // Populate the table with data
                jsonData.forEach((review, index) => {
                    // Create original review row
                    const originalRow = document.createElement('tr');
                    originalRow.className = 'original-row';
                    
                    const originalReviewCell = document.createElement('td');
                    originalReviewCell.textContent = review.original_review || '';
                    originalRow.appendChild(originalReviewCell);
                    
                    const englishTranslationCell = document.createElement('td');
                    englishTranslationCell.textContent = review.english_translation || '';
                    originalRow.appendChild(englishTranslationCell);
                    
                    const reviewLanguageCell = document.createElement('td');
                    reviewLanguageCell.textContent = review.review_language || '';
                    originalRow.appendChild(reviewLanguageCell);
                    
                    resultsTableBody.appendChild(originalRow);
                    
                    // Create corrected review row with diff highlighting
                    const correctedRow = document.createElement('tr');
                    correctedRow.className = 'corrected-row';
                    
                    const correctedReviewCell = document.createElement('td');
                    const reviewDiff = createTextDiff(review.original_review || '', review.corrected_review || '');
                    correctedReviewCell.innerHTML = reviewDiff;
                    correctedRow.appendChild(correctedReviewCell);
                    
                    const gptTranslationCell = document.createElement('td');
                    const translationDiff = createTextDiff(review.english_translation || '', review.gpt_translation || '');
                    gptTranslationCell.innerHTML = translationDiff;
                    correctedRow.appendChild(gptTranslationCell);
                    
                    const detectedLanguagesCell = document.createElement('td');
                    detectedLanguagesCell.textContent = review.detected_languages || '';
                    correctedRow.appendChild(detectedLanguagesCell);
                    
                    resultsTableBody.appendChild(correctedRow);
                    
                    // Add a blank separator row after each review pair (except for the last one)
                    if (index < jsonData.length - 1) {
                        const separatorRow = document.createElement('tr');
                        const separatorCell = document.createElement('td');
                        separatorCell.colSpan = 3;
                        separatorCell.style.height = '20px';
                        separatorCell.style.borderTop = 'none';
                        separatorCell.style.borderBottom = 'none';
                        separatorCell.style.backgroundColor = 'transparent';
                        separatorCell.innerHTML = '&nbsp;';
                        separatorRow.appendChild(separatorCell);
                        resultsTableBody.appendChild(separatorRow);
                    }
                });
                
                // Update table info
                resultsTableInfo.textContent = `${jsonData.length} reviews analyzed`;
                
                // Show the table
                resultsTableContainer.style.display = 'block';
                
                // Add click-to-copy functionality
                const resultsTable = document.getElementById('resultsTable');
                addCopyFunctionality(resultsTable);
                
            } catch (error) {
                console.error('Error parsing GPT response for table:', error);
                resultsTableContainer.style.display = 'none';
            }
        }

        function clearAll() {
            document.getElementById('textInput').value = '';
            document.getElementById('jsonPreview').value = '';
            document.getElementById('promptInput').value = 'Please proofread the following text and analyze its sentiment. Provide corrections for any grammar, spelling, or style issues, and give an overall sentiment analysis:';
            document.getElementById('result').style.display = 'none';
            document.getElementById('resultContainer').style.display = 'none';
