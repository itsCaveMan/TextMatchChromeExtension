<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proof Read Sentiment App - TextMatch</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            padding: 3rem;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 700px;
            width: 90%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 2rem;
            font-size: 2.5rem;
            font-weight: 300;
        }
        
        .input-group {
            margin-bottom: 2rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
            font-weight: 500;
            text-align: left;
        }
        
        input[type="password"], input[type="text"] {
            width: 100%;
            padding: 1rem;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
            box-sizing: border-box;
            font-family: inherit;
        }
        
        textarea {
            width: 100%;
            min-height: 150px;
            padding: 1rem;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
            box-sizing: border-box;
            resize: vertical;
            font-family: inherit;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s ease;
            margin: 0.5rem;
        }
        
        .button:hover {
            transform: translateY(-2px);
        }
        
        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .description {
            color: #666;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        
        .navigation {
            margin-bottom: 2rem;
        }
        
        .nav-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        
        .nav-link:hover {
            text-decoration: underline;
        }
        
        .result-container {
            margin-top: 2rem;
            padding: 1.5rem;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            text-align: left;
            display: none;
        }
        
        .result-container h3 {
            margin-top: 0;
            color: #333;
        }
        
        .result-text {
            color: #555;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        
        .loading {
            color: #667eea;
            font-weight: 500;
            font-style: italic;
        }
        
        .error {
            color: #dc3545;
            font-weight: 500;
        }
        
        .api-key-note {
            font-size: 0.9rem;
            color: #666;
            font-style: italic;
            text-align: left;
        }
        
        .cells-container {
            max-height: 200px;
            overflow-y: auto;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            padding: 1rem;
            background: #f8f9fa;
            text-align: left;
        }
        
        .cells-placeholder {
            color: #999;
            font-style: italic;
            margin: 0;
            text-align: center;
        }
        
        .cell-item {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 0.5rem;
            margin-bottom: 0.5rem;
            font-family: monospace;
            font-size: 0.9rem;
            word-break: break-word;
        }
        
        .cell-item:last-child {
            margin-bottom: 0;
        }
        
        .cell-item.empty {
            background: #f8f9fa;
            color: #999;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="navigation">
            <a href="index.html" class="nav-link">← Back to Main</a>
        </div>
        
        <h1>Proof Read Sentiment App</h1>
        <p class="description">
            Enter your OpenAI API key, customize your prompt, and get AI-powered text analysis.
        </p>
        
        <form id="textForm">
            <div class="input-group">
                <label for="apiKey">OpenAI API Key</label>
                <input 
                    type="password" 
                    id="apiKey" 
                    name="apiKey" 
                    placeholder="sk-..." 
                    required>
                <p class="api-key-note">Your API key is stored locally and never sent to our servers.</p>
            </div>
            
            <div class="input-group">
                <label for="promptInput">LLM Prompt</label>
                <textarea 
                    id="promptInput" 
                    name="promptInput" 
                    placeholder="Enter your custom prompt for the AI (e.g., 'Please proofread and analyze the sentiment of the following text:')" 
                    required>Please proofread the following text and analyze its sentiment. Provide corrections for any grammar, spelling, or style issues, and give an overall sentiment analysis:</textarea>
            </div>
            
            <div class="input-group">
                <label for="textInput">Text to Analyze</label>
                <textarea 
                    id="textInput" 
                    name="textInput" 
                    placeholder="Enter your text here for proofreading and sentiment analysis..." 
                    required>
                </textarea>
            </div>
            
            <div class="input-group">
                <label for="cellsList">Cells</label>
                <div id="cellsList" class="cells-container">
                    <p class="cells-placeholder">Paste Excel data above to see individual cells here</p>
                </div>
            </div>
            
            <button type="submit" class="button" id="submitBtn">Analyze with GPT</button>
            <button type="button" class="button" onclick="clearAll()">Clear All</button>
        </form>
        
        <div id="result" class="loading" style="margin-top: 2rem; display: none;"></div>
        
        <div id="resultContainer" class="result-container">
            <h3>AI Analysis Results</h3>
            <div id="resultText" class="result-text"></div>
        </div>
    </div>

    <script>
        // Load saved values on page load
        window.addEventListener('load', function() {
            const savedApiKey = localStorage.getItem('openai_api_key');
            const savedPrompt = localStorage.getItem('llm_prompt');
            const savedText = localStorage.getItem('text_to_analyze');
            
            if (savedApiKey) {
                document.getElementById('apiKey').value = savedApiKey;
            }
            
            if (savedPrompt) {
                document.getElementById('promptInput').value = savedPrompt;
            } else {
                // If no saved prompt, ensure the default is saved to localStorage
                const defaultPrompt = document.getElementById('promptInput').value;
                if (defaultPrompt) {
                    localStorage.setItem('llm_prompt', defaultPrompt);
                }
            }
            
            if (savedText) {
                document.getElementById('textInput').value = savedText;
                updateCellsDisplay();
            }
        });

        // Save values to localStorage when they change
        document.getElementById('apiKey').addEventListener('input', function() {
            localStorage.setItem('openai_api_key', this.value);
        });

        document.getElementById('promptInput').addEventListener('input', function() {
            localStorage.setItem('llm_prompt', this.value);
        });

        // Function to update cells display
        function updateCellsDisplay() {
            const textInput = document.getElementById('textInput');
            const cellsList = document.getElementById('cellsList');
            const text = textInput.value.trim();
            
            if (!text) {
                cellsList.innerHTML = '<p class="cells-placeholder">Paste Excel data above to see individual cells here</p>';
                return;
            }
            
            // Split text by lines and filter out empty lines
            const cells = text.split('\n').map(line => line.trim());
            
            if (cells.length === 0 || (cells.length === 1 && cells[0] === '')) {
                cellsList.innerHTML = '<p class="cells-placeholder">Paste Excel data above to see individual cells here</p>';
                return;
            }
            
            // Create HTML for cells
            let cellsHTML = '';
            cells.forEach((cell, index) => {
                if (cell === '') {
                    cellsHTML += `<div class="cell-item empty">Cell ${index + 1}: (empty)</div>`;
                } else {
                    cellsHTML += `<div class="cell-item">Cell ${index + 1}: ${escapeHtml(cell)}</div>`;
                }
            });
            
            cellsList.innerHTML = cellsHTML;
        }
        
        // Function to escape HTML characters
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('textInput').addEventListener('input', function() {
            localStorage.setItem('text_to_analyze', this.value);
            updateCellsDisplay();
        });

        // Convert tabs to new lines when pasting into text input
        document.getElementById('textInput').addEventListener('paste', function(e) {
            e.preventDefault();
            
            // Get the pasted data
            const paste = (e.clipboardData || window.clipboardData).getData('text');
            
            // Convert tabs to new lines
            const convertedText = paste.replace(/\t/g, '\n');
            
            // Insert the converted text at cursor position
            const start = this.selectionStart;
            const end = this.selectionEnd;
            const currentValue = this.value;
            
            this.value = currentValue.substring(0, start) + convertedText + currentValue.substring(end);
            
            // Set cursor position after the inserted text
            const newCursorPos = start + convertedText.length;
            this.setSelectionRange(newCursorPos, newCursorPos);
            
            // Trigger input event to save to localStorage and update cells
            this.dispatchEvent(new Event('input'));
        });

        document.getElementById('textForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const apiKey = document.getElementById('apiKey').value.trim();
            const prompt = document.getElementById('promptInput').value.trim();
            const text = document.getElementById('textInput').value.trim();
            
            const resultDiv = document.getElementById('result');
            const resultContainer = document.getElementById('resultContainer');
            const resultText = document.getElementById('resultText');
            const submitBtn = document.getElementById('submitBtn');
            
            if (!apiKey || !prompt || !text) {
                let missingFields = [];
                if (!apiKey) missingFields.push('OpenAI API Key');
                if (!prompt) missingFields.push('LLM Prompt');
                if (!text) missingFields.push('Text to Analyze');
                
                resultDiv.textContent = `Please fill in: ${missingFields.join(', ')}`;
                resultDiv.className = 'error';
                resultDiv.style.display = 'block';
                return;
            }
            
            // Save API key to localStorage
            localStorage.setItem('openai_api_key', apiKey);
            
            // Show loading state
            resultDiv.textContent = 'Analyzing with GPT... Please wait.';
            resultDiv.className = 'loading';
            resultDiv.style.display = 'block';
            resultContainer.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Analyzing...';
            
            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-4.1',
                        messages: [
                            {
                                role: 'user',
                                content: `${prompt}\n\nText to analyze:\n${text}`
                            }
                        ],
                        max_tokens: 1500,
                        temperature: 0.7
                    })
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(`API Error: ${errorData.error?.message || 'Unknown error'}`);
                }
                
                const data = await response.json();
                const analysisResult = data.choices[0].message.content;
                
                // Display results
                resultDiv.style.display = 'none';
                resultText.textContent = analysisResult;
                resultContainer.style.display = 'block';
                
            } catch (error) {
                console.error('Error:', error);
                resultDiv.textContent = `Error: ${error.message}`;
                resultDiv.className = 'error';
                resultContainer.style.display = 'none';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Analyze with GPT';
            }
        });
        
        function clearAll() {
            document.getElementById('textInput').value = '';
            document.getElementById('promptInput').value = 'Please proofread the following text and analyze its sentiment. Provide corrections for any grammar, spelling, or style issues, and give an overall sentiment analysis:';
            document.getElementById('result').style.display = 'none';
            document.getElementById('resultContainer').style.display = 'none';
            
            // Clear localStorage for prompt and text (keep API key)
            localStorage.removeItem('llm_prompt');
            localStorage.removeItem('text_to_analyze');
        }
    </script>
</body>
</html>
